name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Check backend formatting
        working-directory: backend
        run: npm run format-check

      - name: Run backend tests
        working-directory: backend
        env:
          SQLITE_DB_LOCATION: /tmp/todo.db
        run: npm test

      - name: SonarQube analysis
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Install client dependencies
        working-directory: client
        run: npm ci

      - name: Lint client
        working-directory: client
        run: npm run lint

      - name: Build client
        working-directory: client
        run: npm run build

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build backend Docker image
        run: |
          docker build \
            -t ghcr.io/${{ github.repository }}/todo-backend:${{ github.sha }} \
            -f Dockerfile .

      - name: Scan backend image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository }}/todo-backend:${{ github.sha }}
          format: table
          exit-code: 0
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL

      - name: Build client Docker image
        run: |
          docker build \
            -t ghcr.io/${{ github.repository }}/todo-client:${{ github.sha }} \
            -f client/Dockerfile .

      - name: Scan client image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository }}/todo-client:${{ github.sha }}
          format: table
          exit-code: 0
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL

      - name: Push backend Docker image
        if: github.event_name == 'push'
        run: docker push ghcr.io/${{ github.repository }}/todo-backend:${{ github.sha }}

      - name: Push client Docker image
        if: github.event_name == 'push'
        run: docker push ghcr.io/${{ github.repository }}/todo-client:${{ github.sha }}
        